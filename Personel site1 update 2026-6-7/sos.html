    <style>
        @font-face {
            font-family: 'Ray';
            src: url('assets/fonts/Ray-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-body: #090c14;
            --bg-header: rgba(9, 12, 20, 0.85);
            --bg-card: rgba(30, 41, 59, 0.6);
            --bg-card-hover: rgba(51, 65, 85, 0.85);
            --bg-input: rgba(30, 41, 59, 0.8);
            --bg-input-focus: rgba(30, 41, 59, 0.98);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.45);
            --accent-dark: #0ea5e9;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.35);
            --border-input: rgba(255, 255, 255, 0.12);
            --shadow-card: 0 8px 32px -8px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 20px 40px -10px rgba(56, 189, 248, 0.2);
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --font-main: 'Ray', 'Tahoma', 'Segoe UI', system-ui, sans-serif;
            --transition-fast: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.38s cubic-bezier(0.25, 0.8, 0.25, 1);
            --bg-gradient-1: rgba(56, 189, 248, 0.04);
            --bg-gradient-2: rgba(14, 165, 233, 0.04);
            --toggle-bg: rgba(30, 41, 59, 0.9);
            --toggle-border: rgba(255, 255, 255, 0.12);
        }

        body.light {
            --bg-body: #f0f4f8;
            --bg-header: rgba(240, 244, 248, 0.88);
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(255, 255, 255, 0.98);
            --bg-input: rgba(255, 255, 255, 0.9);
            --bg-input-focus: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-color: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.3);
            --accent-dark: #0369a1;
            --border-color: rgba(0, 0, 0, 0.08);
            --border-highlight: rgba(2, 132, 199, 0.35);
            --border-input: rgba(0, 0, 0, 0.12);
            --shadow-card: 0 4px 24px -4px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 16px 40px -8px rgba(2, 132, 199, 0.18);
            --bg-gradient-1: rgba(2, 132, 199, 0.04);
            --bg-gradient-2: rgba(14, 165, 233, 0.03);
            --toggle-bg: rgba(255, 255, 255, 0.95);
            --toggle-border: rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent
        }

        html {
            scroll-behavior: smooth
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: var(--font-main);
            line-height: 1.6;
            padding-bottom: 80px;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 10% 20%, var(--bg-gradient-1) 0%, transparent 25%),
                radial-gradient(circle at 90% 80%, var(--bg-gradient-2) 0%, transparent 25%);
            background-attachment: fixed;
            transition: background-color .35s ease, color .35s ease;
        }

        ::-webkit-scrollbar {
            width: 6px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 3px
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color)
        }

        /* ── HEADER ── */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-header);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, .25);
            transition: background .35s ease, border-color .35s ease;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0
        }

        /* Logo */
        .logo {
            position: relative;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
        }

        .logo img {
            position: absolute;
            inset: 0;
            width: 42px;
            height: 42px;
            object-fit: contain;
            transition: opacity .3s;
        }

        .logo .logo-dark {
            opacity: 1;
        }

        .logo .logo-light {
            opacity: 0;
        }

        body.light .logo-dark {
            opacity: 0;
        }

        body.light .logo-light {
            opacity: 1;
        }

        .header-title h1 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            white-space: nowrap;
            transition: color .35s
        }

        .header-title p {
            font-size: .72rem;
            color: var(--text-muted);
            white-space: nowrap;
            transition: color .35s
        }

        /* ── STATS ── */
        .header-stats {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .stat-badge {
            background: rgba(56, 189, 248, .1);
            border: 1px solid rgba(56, 189, 248, .2);
            border-radius: var(--radius-sm);
            padding: 3px 10px;
            font-size: .72rem;
            color: var(--accent-color);
            white-space: nowrap;
            font-weight: 600;
        }

        body.light .stat-badge {
            background: rgba(2, 132, 199, .08);
            border-color: rgba(2, 132, 199, .2)
        }

        /* ── SEARCH ── */
        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 380px;
            min-width: 0
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: color .2s;
            z-index: 1
        }

        .search-input:focus~.search-icon {
            color: var(--accent-color)
        }

        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: var(--text-muted);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--bg-body);
            font-size: 12px;
            font-weight: 700;
            transition: var(--transition-fast);
            padding: 0;
            line-height: 1;
        }

        .search-clear:hover {
            background: var(--accent-color);
            transform: translateY(-50%) scale(1.1)
        }

        .search-clear.visible {
            display: flex
        }

        .search-input {
            width: 100%;
            padding: 10px 38px 10px 42px;
            background: var(--bg-input);
            border: 1.5px solid var(--border-input);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: .88rem;
            transition: var(--transition-fast);
            backdrop-filter: blur(12px);
        }

        .search-input::placeholder {
            color: var(--text-muted)
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: var(--bg-input-focus);
        }

        /* ── HISTORY DROPDOWN ── */
        .history-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, .4);
            z-index: 9999;
            overflow: hidden;
            display: none;
        }

        .history-dropdown.open {
            display: block;
            animation: fdDown .18s ease
        }

        @keyframes fdDown {
            from {
                opacity: 0;
                transform: translateY(-6px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .history-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px 6px;
            font-size: .72rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        .history-clear-all {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--accent-color);
            font-size: .72rem;
            padding: 2px 6px;
            border-radius: 4px;
            transition: var(--transition-fast);
        }

        .history-clear-all:hover {
            background: rgba(56, 189, 248, .1)
        }

        .h-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            cursor: pointer;
            transition: background .15s;
            gap: 8px;
        }

        .h-item:hover {
            background: rgba(255, 255, 255, .05)
        }

        body.light .h-item:hover {
            background: rgba(0, 0, 0, .04)
        }

        .h-item-txt {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: .83rem;
            color: var(--text-secondary);
            flex: 1;
            min-width: 0;
        }

        .h-item-txt span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .h-item-del {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: .75rem;
            transition: var(--transition-fast);
            flex-shrink: 0;
            opacity: 0;
        }

        .h-item:hover .h-item-del {
            opacity: 1
        }

        .h-item-del:hover {
            color: #f87171;
            background: rgba(248, 113, 113, .1)
        }

        /* ── HEADER ACTIONS ── */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            background: var(--toggle-bg);
            border: 1.5px solid var(--toggle-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .icon-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow)
        }

        .icon-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(56, 189, 248, .08)
        }

        .icon-btn svg {
            transition: transform .4s cubic-bezier(.34, 1.56, .64, 1)
        }

        .icon-btn:hover svg {
            transform: rotate(18deg)
        }

        .icon-sun {
            display: none
        }

        .icon-moon {
            display: block
        }

        body.light .icon-sun {
            display: block
        }

        body.light .icon-moon {
            display: none
        }

        .personal-link {
            background: linear-gradient(90deg, var(--accent-color), var(--accent-dark));
            color: #fff;
            padding: 9px 18px;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-size: .83rem;
            font-weight: 700;
            letter-spacing: .4px;
            transition: var(--transition-fast);
            box-shadow: 0 4px 16px var(--accent-glow);
            border: 1px solid rgba(255, 255, 255, .15);
            white-space: nowrap;
        }

        .personal-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px var(--accent-glow);
            filter: brightness(1.1)
        }

        /* ── FILTER TAGS BAR ── */
        .filter-bar {
            position: sticky;
            top: 61px;
            z-index: 999;
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
            transition: background .35s, border-color .35s;
        }

        .filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 9px 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
            align-items: center;
        }

        .filter-scroll::-webkit-scrollbar {
            display: none
        }

        .f-tag {
            flex-shrink: 0;
            padding: 5px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: .78rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-fast);
            white-space: nowrap;
            user-select: none;
        }

        .f-tag:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(56, 189, 248, .06)
        }

        .f-tag.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
            box-shadow: 0 2px 12px var(--accent-glow);
            font-weight: 600;
        }

        .add-site-tag {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 13px;
            background: rgba(56, 189, 248, .06);
            border: 1px dashed rgba(56, 189, 248, .35);
            border-radius: 20px;
            font-size: .78rem;
            color: var(--accent-color);
            cursor: pointer;
            transition: var(--transition-fast);
            white-space: nowrap;
        }

        .add-site-tag:hover {
            background: rgba(56, 189, 248, .14);
            border-color: var(--accent-color)
        }

        /* ── CONTAINER ── */
        .container {
            max-width: 980px;
            margin: 28px auto;
            padding: 0 24px
        }

        /* ── PINNED ── */
        .pinned-section {
            display: none;
            margin-bottom: 10px
        }

        .pinned-section.has-pins {
            display: block
        }

        .pinned-title {
            color: #fbbf24;
            font-size: 1.1rem;
            margin: 0 0 14px;
            padding-right: 18px;
            padding-bottom: 10px;
            border-bottom: 1.5px solid rgba(251, 191, 36, .2);
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .pinned-title::before {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-60%);
            width: 7px;
            height: 7px;
            background: #fbbf24;
            border-radius: 50%;
            box-shadow: 0 0 8px #fbbf24;
        }

        /* ── CATEGORY ── */
        .cat-section {
            transition: opacity .25s
        }

        .cat-section.drag-over-top {
            border-top: 2px solid var(--accent-color)
        }

        .cat-section.drag-over-bottom {
            border-bottom: 2px solid var(--accent-color)
        }

        .category-title {
            color: var(--accent-color);
            font-size: 1.2rem;
            margin: 46px 0 16px;
            padding-right: 18px;
            padding-bottom: 10px;
            border-bottom: 1.5px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            transition: color .35s, border-color .35s;
            user-select: none;
        }

        .category-title::before {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-60%);
            width: 7px;
            height: 7px;
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
        }

        .drag-handle {
            margin-right: auto;
            color: var(--text-muted);
            cursor: grab;
            opacity: 0;
            transition: opacity .2s;
            padding: 3px;
            flex-shrink: 0;
        }

        .cat-section:hover .drag-handle {
            opacity: .7
        }

        .cat-section.dragging {
            opacity: .35
        }

        /* ── GRID ── */
        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        /* compact */
        body.compact .sites-grid {
            grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
            gap: 8px
        }

        body.compact .site-card {
            padding: 10px 14px;
            border-radius: var(--radius-md)
        }

        body.compact .site-url {
            display: none
        }

        body.compact .site-name {
            font-size: .88rem
        }

        body.compact .card-arrow {
            width: 30px;
            height: 30px
        }

        body.compact .card-arrow svg {
            width: 13px;
            height: 13px
        }

        body.compact .category-title {
            font-size: 1rem;
            margin: 34px 0 11px
        }

        /* ── CARD ── */
        .site-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: var(--transition-slow);
            position: relative;
            overflow: visible;
            box-shadow: var(--shadow-card);
            animation: fadeUp .5s cubic-bezier(.2, .8, .2, 1) forwards;
            opacity: 0;
            transform: translateY(14px);
        }

        .site-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 70% 50%, var(--accent-glow), transparent 55%);
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
        }

        .site-card:hover::after {
            opacity: .12
        }

        .site-card:hover {
            transform: translateY(-5px) scale(1.015);
            border-color: var(--border-highlight);
            box-shadow: var(--shadow-hover);
            background: var(--bg-card-hover);
        }

        .site-card:active {
            transform: translateY(-1px) scale(.98)
        }

        .site-card.is-pinned {
            border-color: rgba(251, 191, 36, .3)
        }

        .site-card.is-pinned:hover {
            border-color: rgba(251, 191, 36, .6);
            box-shadow: 0 20px 40px -10px rgba(251, 191, 36, .2)
        }

        /* card micro-actions */
        .card-actions {
            position: absolute;
            top: -11px;
            left: -8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity .2s;
            z-index: 10;
        }

        .site-card:hover .card-actions {
            opacity: 1
        }

        .c-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--bg-card-hover);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-fast);
            color: var(--text-muted);
            font-size: 11px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
            text-decoration: none;
        }

        .c-btn:hover {
            transform: scale(1.15);
            color: var(--accent-color);
            border-color: var(--accent-color)
        }

        .c-btn.pin-active {
            color: #fbbf24;
            border-color: rgba(251, 191, 36, .5);
            background: rgba(251, 191, 36, .1)
        }

        .c-btn.del-btn:hover {
            color: #f87171;
            border-color: rgba(248, 113, 113, .5);
            background: rgba(248, 113, 113, .1)
        }

        /* online dot */
        .online-dot {
            position: absolute;
            bottom: 8px;
            left: 10px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--border-color);
            transition: background .4s;
        }

        .online-dot.up {
            background: #4ade80;
            box-shadow: 0 0 7px rgba(74, 222, 128, .7);
            animation: pulseG 2s infinite
        }

        .online-dot.down {
            background: #f87171;
            box-shadow: 0 0 6px rgba(248, 113, 113, .5)
        }

        @keyframes pulseG {

            0%,
            100% {
                box-shadow: 0 0 4px rgba(74, 222, 128, .5)
            }

            50% {
                box-shadow: 0 0 11px rgba(74, 222, 128, .9)
            }
        }

        /* last visit */
        .visit-lbl {
            position: absolute;
            bottom: 7px;
            right: 52px;
            font-size: .62rem;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity .2s;
            white-space: nowrap;
            pointer-events: none;
        }

        .site-card:hover .visit-lbl {
            opacity: 1
        }

        /* ── site info ── */
        .site-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 1;
            min-width: 0;
            flex: 1
        }

        .site-name {
            font-weight: 700;
            font-size: .97rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color .2s
        }

        .site-card:hover .site-name {
            color: var(--accent-color)
        }

        .site-url {
            font-size: .72rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            direction: ltr;
            font-family: monospace;
            opacity: .75
        }

        .card-arrow {
            width: 38px;
            height: 38px;
            background: rgba(56, 189, 248, .07);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            transition: var(--transition-fast);
            flex-shrink: 0;
            margin-right: 10px;
        }

        .card-arrow svg {
            width: 17px;
            height: 17px;
            transition: transform .3s ease
        }

        .site-card:hover .card-arrow {
            background: var(--accent-color);
            color: #fff;
            transform: translateX(-5px);
            box-shadow: 0 0 14px var(--accent-glow)
        }

        .site-card:hover .card-arrow svg {
            transform: translateX(3px)
        }

        .no-results {
            display: none;
            text-align: center;
            color: var(--text-muted);
            padding: 80px 0 40px;
            font-size: 1rem
        }

        .no-results svg {
            display: block;
            margin: 0 auto 16px;
            opacity: .35
        }

        .toast-wrap {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 7px;
            align-items: center;
            pointer-events: none;
        }

        .toast {
            background: rgba(15, 23, 42, .97);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 9px 22px;
            font-size: .84rem;
            color: var(--text-primary);
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
            animation: toastIn .28s cubic-bezier(.34, 1.56, .64, 1);
            white-space: nowrap;
        }

        .toast.ok {
            border-color: rgba(74, 222, 128, .35);
            color: #4ade80
        }

        .toast.info {
            border-color: var(--border-highlight);
            color: var(--accent-color)
        }

        .toast.err {
            border-color: rgba(248, 113, 113, .35);
            color: #f87171
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(.94)
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1)
            }
        }

        body.light .toast {
            background: rgba(255, 255, 255, .97)
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(8px);
            z-index: 99998;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 26px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(24px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
            animation: modalIn .3s cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(.92) translateY(18px)
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary)
        }

        .modal-x {
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 16px;
            transition: var(--transition-fast);
        }

            color: var(--text-primary);
            background: rgba(255, 255, 255, .1)
        }

            margin-bottom: 14px
        }

            display: block;
            font-size: .78rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600
        }

        .modal-input,
        .modal-select {
            width: 100%;
            padding: 10px 13px;
            background: var(--bg-input);
            border: 1.5px solid var(--border-input);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: .88rem;
            transition: var(--transition-fast);
        }

        .modal-input:focus,
        .modal-select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow)
        }

        .modal-input::placeholder {
            color: var(--text-muted)
        }

        .modal-select {
            cursor: pointer
        }

        .modal-select option {
            background: #1e293b;
            color: var(--text-primary)
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 20px
        }

        .btn-ok {
            flex: 1;
            padding: 11px;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-dark));
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            font-family: var(--font-main);
            font-size: .88rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-fast);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .btn-ok:hover {
            transform: translateY(-1px);
            filter: brightness(1.1)
        }

        .btn-cancel {
            padding: 11px 18px;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-size: .88rem;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .btn-cancel:hover {
            border-color: var(--accent-color);
            color: var(--accent-color)
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* ── RESPONSIVE ── */
        @media(max-width:1024px) {
            .container {
                max-width: 100%
            }

                grid-template-columns: repeat(auto-fill, minmax(230px, 1fr))
            }
        }

        @media(max-width:900px) {

            }

            }

            }
        }

            }

        // ════════════════════════════
        //  STATE & STORAGE
        // ════════════════════════════
        const S = {
            get data() { return JSON.parse(localStorage.getItem('sd') || 'null') || DEFAULT_DATA },
            set data(v) { localStorage.setItem('sd', JSON.stringify(v)) },
            get order() { return JSON.parse(localStorage.getItem('so') || 'null') },
            set order(v) { localStorage.setItem('so', JSON.stringify(v)) },
            get pins() { return JSON.parse(localStorage.getItem('sp') || '[]') },
            set pins(v) { localStorage.setItem('sp', JSON.stringify(v)) },
            get history() { return JSON.parse(localStorage.getItem('sh') || '[]') },
            set history(v) { localStorage.setItem('sh', JSON.stringify(v)) },
            get visits() { return JSON.parse(localStorage.getItem('sv') || '{}') },
            set visits(v) { localStorage.setItem('sv', JSON.stringify(v)) },
        };

        let activeCat = 'all';
        let dragSrc = null;

        // ── helpers ──
        const $ = id => document.getElementById(id);
        const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);


        function toast(msg, type = 'info', ms = 2300) {
            const w = $('toastWrap');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            w.appendChild(t);
            setTimeout(() => {
                t.style.cssText = 'opacity:0;transform:translateY(8px);transition:all .28s';
                setTimeout(() => t.remove(), 300);
            }, ms);
        }

        function timeAgo(ts) {
            if (!ts) return '';
            const m = Math.floor((Date.now() - ts) / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
            if (m < 2) return 'همین الان';
            if (m < 60) return `${fa(m)} دقیقه پیش`;
            if (h < 24) return `${fa(h)} ساعت پیش`;
            return `${fa(d)} روز پیش`;
        }

        // ── ordered data ──
        function orderedData() {
            const raw = S.data;
            const ord = S.order;
            if (!ord) return raw;
            const out = [];
            ord.forEach(t => { const c = raw.find(x => x.title === t); if (c) out.push(c); });
            raw.forEach(c => { if (!out.find(x => x.title === c.title)) out.push(c); });
            return out;
        }

        // ════════════════════════════
        //  ONLINE CHECK
        // ════════════════════════════
        function checkOnline(url, dot) {
            try {
                const origin = new URL(url).origin;
                const img = new Image();
                const tid = setTimeout(() => { dot.classList.add('down'); }, 5000);
                img.onload = img.onerror = () => {
                    clearTimeout(tid);
                    dot.classList.add('up');
                };
                img.src = `${origin}/favicon.ico?_=${Date.now()}`;
            } catch (e) { }
        }

        // ════════════════════════════
        //  BUILD CARD
        // ════════════════════════════
        function buildCard(site, catIdx, siteIdx, delay, fromPinned = false) {
            if (!site.n || !site.u) return null;
            const pins = S.pins;
            const visits = S.visits;
            const isPinned = pins.includes(site.u);
            const vd = visits[site.u];

            const card = document.createElement('a');
            card.className = 'site-card' + (isPinned ? ' is-pinned' : '');
            card.href = site.u;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            card.style.animationDelay = `${delay}s`;

            card.innerHTML = `
        <div class="card-actions">
            <button class="c-btn pin-btn${isPinned ? ' pin-active' : ''}" title="${isPinned ? 'حذف پین' : 'پین کردن'}">📌</button>
            <button class="c-btn copy-btn" title="کپی آدرس">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
            </button>
            <button class="c-btn share-btn" title="اشتراک‌گذاری">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
            </button>
            ${!fromPinned ? `<button class="c-btn del-btn" title="حذف">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6M14 11v6"/>
                </svg>
            </button>`: ''}
        </div>
        <div class="site-info">
            <span class="site-name">${site.n}</span>
            <span class="site-url">${site.u}</span>
        </div>
        ${vd ? `<span class="visit-lbl">${timeAgo(vd.time)}</span>` : ''}
        <div class="card-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                style="transform:rotate(180deg)">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </svg>
        </div>
        <div class="online-dot"></div>
    `;

            // online check (staggered)
            setTimeout(() => checkOnline(site.u, card.querySelector('.online-dot')), Math.random() * 2500 + 300);

            // click → track visit
            card.addEventListener('click', e => {
                if (e.target.closest('.card-actions')) return;
                const v = S.visits; v[site.u] = { time: Date.now(), count: (v[site.u]?.count || 0) + 1 }; S.visits = v;
            });

            // pin
            card.querySelector('.pin-btn').addEventListener('click', e => {
                e.preventDefault(); e.stopPropagation();
                const p = S.pins, i = p.indexOf(site.u);
                if (i === -1) { p.push(site.u); S.pins = p; toast('پین شد 📌', 'ok'); }
                else { p.splice(i, 1); S.pins = p; toast('پین برداشته شد', 'info'); }
                render();
            });

            // copy
            card.querySelector('.copy-btn').addEventListener('click', e => {
                e.preventDefault(); e.stopPropagation();
                navigator.clipboard.writeText(site.u)
                    .then(() => toast('آدرس کپی شد ✓', 'ok'))
                    .catch(() => toast('کپی ناموفق', 'err'));
            });

            // share
            card.querySelector('.share-btn').addEventListener('click', e => {
                e.preventDefault(); e.stopPropagation();
                if (navigator.share) navigator.share({ title: site.n, url: site.u }).catch(() => { });
                else navigator.clipboard.writeText(site.u).then(() => toast('لینک کپی شد', 'info'));
            });

            // delete
            const delBtn = card.querySelector('.del-btn');
            if (delBtn) delBtn.addEventListener('click', e => {
                e.preventDefault(); e.stopPropagation();
                const d = S.data;
                const realCat = orderedData()[catIdx];
                const rawCat = d.find(c => c.title === realCat.title);
                if (!rawCat) return;
                const name = rawCat.sites[siteIdx]?.n || 'سایت';
                rawCat.sites.splice(siteIdx, 1);
                if (!rawCat.sites.length) d.splice(d.indexOf(rawCat), 1);
                S.data = d;
                toast(`«${name}» حذف شد`, 'err');
                render();
            });

            return card;
        }

            </svg>`;

                const grid = document.createElement('div');
                grid.className = 'sites-grid';

                let catVis = false;
                cat.sites.forEach((site, si) => {
                    const matchQ = !query ||
                        site.n.toLowerCase().includes(query) ||
                        site.u.toLowerCase().includes(query) ||
                        cat.title.toLowerCase().includes(query);
                    const show = inFilter && matchQ;
                    const card = buildCard(site, catIdx, si, (catIdx * .05) + (si * .03));
                    if (card) {
                        card.style.display = show ? '' : 'none';
                        grid.appendChild(card);
                        if (show) catVis = true;
                    }
                });

                sec.style.display = (inFilter && catVis) ? '' : 'none';
                if (inFilter && catVis) anyVisible = true;

                sec.appendChild(h2);
                sec.appendChild(grid);
                setupDrag(sec);
                app.appendChild(sec);
            });

            $('noResults').style.display = anyVisible ? 'none' : 'flex';
        }

        // ════════════════════════════
        //  DRAG & DROP (categories)
        // ════════════════════════════
        function setupDrag(sec) {
            sec.draggable = true;
            sec.addEventListener('dragstart', e => {
                dragSrc = sec;
                sec.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });
            sec.addEventListener('dragend', () => {
                sec.classList.remove('dragging');
                document.querySelectorAll('.cat-section').forEach(s => {
                    s.classList.remove('drag-over-top', 'drag-over-bottom');
                });
            });
            sec.addEventListener('dragover', e => {
                e.preventDefault();
                if (!dragSrc || dragSrc === sec) return;
                e.dataTransfer.dropEffect = 'move';
                const r = sec.getBoundingClientRect();
                const mid = r.top + r.height / 2;
                sec.classList.toggle('drag-over-top', e.clientY < mid);
                sec.classList.toggle('drag-over-bottom', e.clientY >= mid);
            });
            sec.addEventListener('dragleave', () => {
                sec.classList.remove('drag-over-top', 'drag-over-bottom');
            });
            sec.addEventListener('drop', e => {
                e.preventDefault();
                if (!dragSrc || dragSrc === sec) return;
                const app = $('app');
                const secs = [...app.querySelectorAll('.cat-section')];
                const r = sec.getBoundingClientRect();
                const before = e.clientY < r.top + r.height / 2;
                if (before) app.insertBefore(dragSrc, sec);
                else sec.after(dragSrc);
                // save order
                const newOrder = [...app.querySelectorAll('.cat-section')].map(s => s.dataset.catTitle);
                S.order = newOrder;
                sec.classList.remove('drag-over-top', 'drag-over-bottom');
            });
        }

        // ════════════════════════════
        //  SEARCH
        // ════════════════════════════
        function doSearch() {
            const q = $('searchInput').value.trim().toLowerCase();
            $('searchClear').classList.toggle('visible', q.length > 0);

            const od = orderedData();
            let any = false;

            $('app').querySelectorAll('.cat-section').forEach(sec => {
                const cat = od.find(c => c.title === sec.dataset.catTitle);
                if (!cat) { sec.style.display = 'none'; return; }
                const inF = activeCat === 'all' || activeCat === cat.title;
                let vis = false;
                sec.querySelectorAll('.site-card').forEach((card, i) => {
                    const site = cat.sites[i];
                    if (!site) { card.style.display = 'none'; return; }
                    const m = !q || site.n.toLowerCase().includes(q) || site.u.toLowerCase().includes(q) || cat.title.toLowerCase().includes(q);
                    card.style.display = (inF && m) ? '' : 'none';
                    if (inF && m) vis = true;
                });
                sec.style.display = (inF && vis) ? '' : 'none';
                if (inF && vis) any = true;
            });
            $('noResults').style.display = any ? 'none' : 'flex';
        }

        // ════════════════════════════
        //  SEARCH HISTORY
        // ════════════════════════════
        function addHistory(q) {
            if (!q || q.length < 2) return;
            let h = S.history.filter(x => x !== q);
            h.unshift(q);
            if (h.length > 8) h = h.slice(0, 8);
            S.history = h;
        }

        function renderHistory() {
            const drop = $('histDrop');
            const h = S.history;
            if (!h.length) { drop.classList.remove('open'); return; }
            drop.innerHTML = '';
            const head = document.createElement('div');
            head.className = 'history-head';
            head.innerHTML = `<span>جستجوهای اخیر</span>
        <button class="history-clear-all" id="hClearAll">پاک کردن همه</button>`;
            drop.appendChild(head);
            h.forEach((q, i) => {
                const item = document.createElement('div');
                item.className = 'h-item';
                item.innerHTML = `<div class="h-item-txt">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span>${q}</span></div>
            <button class="h-item-del" data-i="${i}">×</button>`;
                item.querySelector('.h-item-txt').addEventListener('click', () => {
                    $('searchInput').value = q;
                    drop.classList.remove('open');
                    doSearch();
                });
                item.querySelector('.h-item-del').addEventListener('click', e => {
                    e.stopPropagation();
                    const arr = S.history; arr.splice(i, 1); S.history = arr;
                    renderHistory();
                });
                drop.appendChild(item);
            });
            drop.classList.add('open');
            document.getElementById('hClearAll').addEventListener('click', () => {
                S.history = []; drop.classList.remove('open');
            });
        }

        // ════════════════════════════
        //  ADD SITE MODAL
        // ════════════════════════════
        function openModal() {
            $('mName').value = ''; $('mUrl').value = '';
            $('modal').classList.add('open');
            setTimeout(() => $('mName').focus(), 50);
        }
        function closeModal() { $('modal').classList.remove('open'); }

        function saveNewSite() {
            const name = $('mName').value.trim();
            const url = $('mUrl').value.trim();
            const cat = $('mCat').value;
            if (!name || !url) { toast('نام و آدرس الزامی است', 'err'); return; }
            let finalUrl = url;
            if (!/^https?:\/\//i.test(url)) finalUrl = 'https://' + url;

            const d = S.data;

            if (cat === '__new__') {
                const newCatName = prompt('نام دسته جدید:');
                if (!newCatName?.trim()) { toast('نام دسته وارد نشد', 'err'); return; }
                d.push({ title: newCatName.trim(), sites: [{ n: name, u: finalUrl }] });
            } else {
                const c = d.find(x => x.title === cat);
                if (c) c.sites.push({ n: name, u: finalUrl });
            }
            S.data = d;
            closeModal();
            toast(`«${name}» اضافه شد ✓`, 'ok');
            render();
        }

        // ════════════════════════════
        //  THEME & COMPACT
        // ════════════════════════════
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
        if (localStorage.getItem('compact') === '1') document.body.classList.add('compact');

        $('themeBtn').addEventListener('click', () => {
            document.body.classList.toggle('light');
            localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
        });

        const vBtn = $('viewBtn');
        vBtn.classList.toggle('active', document.body.classList.contains('compact'));
        vBtn.addEventListener('click', () => {
            document.body.classList.toggle('compact');
            const on = document.body.classList.contains('compact');
            localStorage.setItem('compact', on ? '1' : '0');
            vBtn.classList.toggle('active', on);
            toast(on ? 'حالت فشرده فعال شد' : 'حالت کارتی فعال شد', 'info');
        });

        // ════════════════════════════
        //  KEYBOARD SHORTCUT  /
        // ════════════════════════════
        document.addEventListener('keydown', e => {
            if (e.key === '/' && document.activeElement !== $('searchInput')) {
                e.preventDefault();
                $('searchInput').focus();
                $('searchInput').select();
            }
            if (e.key === 'Escape') {
                $('histDrop').classList.remove('open');
                closeModal();
                $('searchInput').blur();
            }
        });

        // ════════════════════════════
        //  SEARCH EVENTS
        // ════════════════════════════
        $('searchInput').addEventListener('input', doSearch);

        $('searchInput').addEventListener('focus', () => {
            if (S.history.length) renderHistory();
        });

        $('searchInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const q = $('searchInput').value.trim();
                if (q) { addHistory(q); $('histDrop').classList.remove('open'); }
            }
        });

        $('searchInput').addEventListener('blur', () => {
            setTimeout(() => $('histDrop').classList.remove('open'), 200);
        });

        $('searchClear').addEventListener('click', () => {
            $('searchInput').value = '';
            $('searchInput').focus();
            $('histDrop').classList.remove('open');
            doSearch();
        });

        // ════════════════════════════
        //  MODAL EVENTS
        // ════════════════════════════
        $('modalX').addEventListener('click', closeModal);
        $('mCancel').addEventListener('click', closeModal);
        $('mSave').addEventListener('click', saveNewSite);
        $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
        $('mName').addEventListener('keydown', e => { if (e.key === 'Enter') $('mUrl').focus(); });
        $('mUrl').addEventListener('keydown', e => { if (e.key === 'Enter') saveNewSite(); });

        // ════════════════════════════
        //  INIT
        // ════════════════════════════
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
